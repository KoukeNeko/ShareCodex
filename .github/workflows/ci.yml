name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0-beta.25

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The Wails shell (internal/client/desktop, and the root package on
      # macOS and Windows) is built in the desktop job. On Linux the root
      # package is the CLI only.
      - name: Test
        shell: bash
        run: |
          pkgs=$(go list ./internal/... ./cmd/... | grep -v /internal/client/desktop)
          if [ "$RUNNER_OS" = Linux ]; then pkgs="$pkgs ."; fi
          # shellcheck disable=SC2086 # one argument per package
          go vet $pkgs
          # shellcheck disable=SC2086
          go test $pkgs

  server-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sharecodex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/server/...
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/sharecodex?sslmode=disable

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - run: wails3 generate bindings -clean=true -ts -i
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm check
        working-directory: frontend
      - run: wails3 task build

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
