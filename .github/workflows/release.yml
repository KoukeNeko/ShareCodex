name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0-beta.25
  # Must match the image in deploy/docker-compose.yml.
  SERVER_IMAGE: ghcr.io/koukeneko/sharecodex-server

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: macos-latest
            asset: ShareCodex-macos-universal.zip
          - os: windows-latest
            asset: ShareCodex-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    # Step-level env is not visible to that step's `if`, so whether signing
    # secrets exist is decided here.
    env:
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          plutil -replace CFBundleShortVersionString -string "$VERSION" build/darwin/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" build/darwin/Info.plist
          wails3 task darwin:package:universal VERSION="$VERSION"
      # Developer ID signing and notarization (App Store Connect API key) run
      # only when the secrets are configured; otherwise the bundle keeps its
      # ad-hoc signature.
      - name: Sign and notarize
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          # Keep the existing keychains searchable; the list is split on purpose.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE_P12_BASE64 contains no Developer ID Application certificate"
            exit 1
          fi
          codesign --force --options runtime --timestamp --sign "$identity" bin/ShareCodex.app
          codesign --verify --strict --verbose=2 bin/ShareCodex.app

          ditto -c -k --keepParent bin/ShareCodex.app "$RUNNER_TEMP/notarize.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json)
          echo "$result"
          if [ "$(echo "$result" | jq -r .status)" != "Accepted" ]; then
            xcrun notarytool log "$(echo "$result" | jq -r .id)" \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
            echo "::error::Notarization was not accepted"
            exit 1
          fi
          xcrun stapler staple bin/ShareCodex.app
          spctl --assess --type execute --verbose bin/ShareCodex.app
      - name: Remove signing material
        if: always() && runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/notarize.zip"
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent bin/ShareCodex.app "${{ matrix.asset }}"

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: wails3 task windows:build VERSION="$VERSION"
      - name: Sign Windows app
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 bin\ShareCodex.exe
      - name: Zip Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path bin\ShareCodex.exe -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o sharecodex-server ./cmd/sharecodex-server
            tar czf "sharecodex-server-linux-$arch.tar.gz" sharecodex-server
          done
      # The bundle pins the image to this release so an extracted copy keeps
      # running the version it was downloaded with.
      - name: Bundle Docker Compose files
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir=sharecodex-server-compose
          mkdir "$dir"
          sed "s/SHARECODEX_VERSION:-latest/SHARECODEX_VERSION:-$version/" deploy/docker-compose.yml > "$dir/docker-compose.yml"
          grep -q "sharecodex-server:\${SHARECODEX_VERSION:-$version}" "$dir/docker-compose.yml"
          cp deploy/.env.example "$dir/.env.example"
          zip -r "$dir.zip" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: |
            sharecodex-server-linux-*.tar.gz
            sharecodex-server-compose.zip

  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        env:
          # Otherwise the build record becomes an artifact and the publish
          # job attaches it to the release.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    needs: [desktop, server, server-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Scoop's autoupdate reads hashes from SHA256SUMS.
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  packages:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

  # Rolls the server out on k3s: Argo CD follows homelab-gitops, so the new
  # image tag has to land there.
  deploy:
    needs: server-image
    runs-on: ubuntu-latest
    env:
      # Fine-grained PAT with Contents: read/write on KoukeNeko/homelab-gitops.
      HAS_GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN != '' }}
    steps:
      - name: Skip when GITOPS_TOKEN is not configured
        if: env.HAS_GITOPS_TOKEN != 'true'
        run: echo "GITOPS_TOKEN secret not set; not bumping homelab-gitops."
      - uses: actions/checkout@v7
        if: env.HAS_GITOPS_TOKEN == 'true'
        with:
          repository: KoukeNeko/homelab-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Bump image tag in apps/sharecodex
        if: env.HAS_GITOPS_TOKEN == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) echo "$GITHUB_REF_NAME is a pre-release; not deploying."; exit 0 ;;
          esac
          file=apps/sharecodex/kustomization.yaml
          sed -i -E "s|^([[:space:]]*newTag:).*|\1 ${version}|" "$file"
          git diff --quiet && { echo "already at ${version}"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(sharecodex): roll out ${version}"
          git push
