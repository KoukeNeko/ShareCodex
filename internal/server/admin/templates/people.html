{{define "content"}}
<h1>{{.T.navPeople}}</h1>
{{with .Data.Invite}}
<section class="card invite">
  <h2>{{tf $.T.inviteTitle .Person}}</h2>
  <input type="text" readonly value="{{.Link}}" onfocus="this.select()">
  <p class="muted small" style="margin:0">{{tf $.T.inviteNote (when .Expires)}}</p>
</section>
{{end}}
<section class="card">
  <form class="row" method="post" action="/admin/people">
    <input class="grow" type="text" name="name" placeholder="{{.T.name}}" maxlength="50" required>
    <button class="primary" type="submit">{{.T.addPerson}}</button>
  </form>
  <div class="table-wrap"><table>
    <thead><tr><th>{{.T.name}}</th><th>{{.T.devices}}</th><th></th></tr></thead>
    <tbody>
    {{range .Data.People}}
      <tr>
        <td>{{.DisplayName}}</td>
        <td class="num">{{.ActiveDevices}}</td>
        <td style="text-align:right">
          <form class="inline" method="post" action="/admin/people/{{.ID}}/invite"><button type="submit">{{$.T.createInvite}}</button></form>
        </td>
      </tr>
    {{else}}
      <tr><td colspan="3" class="muted">{{$.T.noPeople}}</td></tr>
    {{end}}
    </tbody>
  </table></div>
</section>
{{end}}
