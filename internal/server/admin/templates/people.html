{{define "content"}}
<h1>成員</h1>
{{with .Data.Invite}}
<section class="card invite">
  <h2>{{.Person}} 的加入連結</h2>
  <input type="text" readonly value="{{.Link}}" onfocus="this.select()">
  <p class="muted small" style="margin:0">只能使用一次，{{when .Expires}} 前有效。關閉此頁後無法再次顯示。</p>
</section>
{{end}}
<section class="card">
  <form class="row" method="post" action="/admin/people">
    <input class="grow" type="text" name="name" placeholder="名稱" maxlength="50" required>
    <button class="primary" type="submit">新增成員</button>
  </form>
  <div class="table-wrap"><table>
    <thead><tr><th>名稱</th><th>裝置</th><th></th></tr></thead>
    <tbody>
    {{range .Data.People}}
      <tr>
        <td>{{.DisplayName}}</td>
        <td class="num">{{.ActiveDevices}}</td>
        <td style="text-align:right">
          <form class="inline" method="post" action="/admin/people/{{.ID}}/invite"><button type="submit">產生加入連結</button></form>
        </td>
      </tr>
    {{else}}
      <tr><td colspan="3" class="muted">沒有成員</td></tr>
    {{end}}
    </tbody>
  </table></div>
</section>
{{end}}
