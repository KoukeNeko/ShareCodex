{{define "content"}}
<div class="row spread">
  <h1>{{.T.dashboard}}</h1>
  <span class="muted small">{{tfh .T.updatedAt (when .Data.GeneratedAt)}}</span>
</div>
{{if .Data.Preview}}<p class="notice">{{.T.previewNote}}</p>{{end}}
{{range .Data.Accounts}}{{template "account" (card . $.T false)}}{{else}}
<div class="card"><p class="muted" style="margin:0">{{.T.noAccounts}}</p></div>
{{end}}
{{end}}
