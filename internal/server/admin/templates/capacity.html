{{define "content"}}
<div class="row spread">
  <div>
    <a class="back" href="/admin/accounts">← {{.T.navAccounts}}</a>
    <h1>{{.Data.AccountLabel}} · {{.T.capacity}}</h1>
  </div>
  <div class="row">
    <a class="button secondary small" href="/admin/accounts/{{.Data.AccountID}}/plans">{{.T.planHistory}}</a>
    <nav class="periods" aria-label="{{.T.capacity}}">
      <a href="/admin/accounts/{{.Data.AccountID}}/capacity?period=24h" class="{{if eq .Data.Period "24h"}}active{{end}}">{{tf .T.hours 24}}</a>
      <a href="/admin/accounts/{{.Data.AccountID}}/capacity?period=7d" class="{{if eq .Data.Period "7d"}}active{{end}}">{{tf .T.days 7}}</a>
      <a href="/admin/accounts/{{.Data.AccountID}}/capacity?period=30d" class="{{if eq .Data.Period "30d"}}active{{end}}">{{tf .T.days 30}}</a>
    </nav>
    <form class="range{{if eq .Data.Period "custom"}} active{{end}}" method="get" action="/admin/accounts/{{.Data.AccountID}}/capacity" data-local-times>
      <input type="datetime-local" aria-label="{{.T.start}}" data-instant="from" data-utc="{{.Data.Start.Format "2006-01-02T15:04:05Z07:00"}}" required>
      <input type="hidden" name="from">
      <input type="datetime-local" aria-label="{{.T.end}}" data-instant="to" data-utc="{{.Data.End.Format "2006-01-02T15:04:05Z07:00"}}" required>
      <input type="hidden" name="to">
      <button class="small" type="submit">{{.T.apply}}</button>
    </form>
  </div>
</div>

{{template "capacityreport" (capacityOf .Data .T)}}
{{end}}
