{{define "content"}}
<form class="card" method="post" action="/admin/login" style="max-width:360px;justify-self:center;width:100%">
  <h1>{{.T.loginTitle}}</h1>
  <input type="password" name="password" placeholder="{{.T.password}}" autocomplete="current-password" required autofocus>
  <button class="primary" type="submit">{{.T.login}}</button>
</form>
{{end}}
