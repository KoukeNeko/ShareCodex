{{define "content"}}
<form class="card" method="post" action="/admin/login" style="max-width:380px;width:100%;justify-self:center;margin-top:64px;border:1px solid var(--line)">
  <h1>{{.T.loginTitle}}</h1>
  <input type="password" name="password" placeholder="{{.T.password}}" autocomplete="current-password" required autofocus>
  <button class="primary" type="submit">{{.T.login}}</button>
</form>
{{end}}
