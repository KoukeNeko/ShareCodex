{{define "content"}}
<h1>{{.T.navDevices}}</h1>
<section class="card">
  <div class="table-wrap"><table>
    <thead><tr><th>{{.T.member}}</th><th>{{.T.device}}</th><th>{{.T.platform}}</th><th>{{.T.lastSeen}}</th><th></th></tr></thead>
    <tbody>
    {{range .Data}}
      <tr>
        <td>{{.PersonName}}</td>
        <td>{{.Name}}</td>
        <td class="muted">{{.Platform}}</td>
        <td class="num muted">{{when .LastSeenAt}}</td>
        <td style="text-align:right">
          {{if .RevokedAt}}<span class="tag off">{{$.T.revoked}}</span>{{else}}
          <form class="inline" method="post" action="/admin/devices/{{.ID}}/revoke" onsubmit="return confirm({{$.T.revokeConfirm}})">
            <button class="danger" type="submit">{{$.T.revoke}}</button>
          </form>{{end}}
        </td>
      </tr>
    {{else}}
      <tr><td colspan="5" class="muted">{{.T.noDevices}}</td></tr>
    {{end}}
    </tbody>
  </table></div>
</section>
{{end}}
